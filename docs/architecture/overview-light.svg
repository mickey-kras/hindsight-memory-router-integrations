<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420" role="img" aria-labelledby="title desc">
  <title id="title">Memory Router ecosystem</title>
  <desc id="desc">Agent clients use Integrations, which send authenticated requests to Memory Router. The router enforces access rules, scanning and limits before Hindsight memory storage. Encrypted quarantine and human review are part of Memory Router. The integrations component is highlighted as this repository.</desc>
