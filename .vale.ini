# Vale configuration for the ASD-STE100 documentation gate.
# The STE style comes from vale-llm-slop. "vale sync" downloads it into StylesPath.
StylesPath = .vale/styles
MinAlertLevel = warning
Packages = https://github.com/Syntaf/vale-llm-slop/releases/download/v0.1.0/vale-llm-slop.zip

# Technical names of this project. See .vale/styles/config/vocabularies/Project/accept.txt.
Vocab = Project

[*.md]
BasedOnStyles = STE
# Bold text holds UI labels, such as **Settings > Rules**. These are technical names.
TokenIgnores = (\*\*[^*\n]+\*\*)

# Vale joins the items of a Markdown list into the paragraph before the list,
# so this rule counts too many sentences. ste-cli rule STE-6.6 checks paragraph length.
STE.ParagraphLength = NO

