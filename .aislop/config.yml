ci:
  failBelow: 95

exclude:
  - coverage
  - dist
  - node_modules
  - npm-shrinkwrap.json
  - packages
  - src/upstream
  - integrations/coding-agents/upstream
  - integrations/coding-agents/UPSTREAM.json

rules:
  security/hardcoded-secret: error
  ai-slop/hardcoded-url: off

quality:
  maxFileLoc: 900
  maxFunctionLoc: 150
