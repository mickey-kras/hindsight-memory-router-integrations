name: aislop
'on':
  workflow_call:
    inputs:
      candidate_ref:
        type: string
        default: ''
      candidate_sha:
        type: string
        default: ''
permissions:
  contents: read
  pull-requests: read
  security-events: write
jobs:
  status:
    uses: ./.github/workflows/trusted-aislop.yml
    with:
      revision_sha: ${{ inputs.candidate_sha }}
      revision_ref: ${{ inputs.candidate_ref }}
