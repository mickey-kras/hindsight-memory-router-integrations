name: aislop
'on':
  workflow_call:
    inputs:
      candidate_ref:
        type: string
        default: ''
      candidate_sha:
        type: string
        default: ''
permissions:
  contents: read
  pull-requests: read
  security-events: write
jobs:
  status:
    uses: mickey-kras/hindsight-memory-router-integrations/.github/workflows/trusted-aislop.yml@fdadc9d93167455b9a0f4494f931beb2562be1ce
    with:
      revision_sha: ${{ inputs.candidate_sha }}
      revision_ref: ${{ inputs.candidate_ref }}
