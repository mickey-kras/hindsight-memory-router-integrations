name: policy recovery

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  guard:
    name: guard
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Run the base revision policy guard
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.event.repository.owner.login }}
          REPO: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          export FILES_JSON="$RUNNER_TEMP/files.json"
          gh api --paginate --slurp \
            "repos/$OWNER/$REPO/pulls/$PR_NUMBER/files?per_page=100" > "$FILES_JSON"
          gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/$OWNER/$REPO/contents/.github/workflows/policy-guard.yml?ref=$BASE_SHA" \
            > "$RUNNER_TEMP/base-policy.yml"
          python3 <<'PY'
          import os
          import pathlib
          import subprocess
          import yaml

          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          workflow = yaml.safe_load((root / 'base-policy.yml').read_text())
          steps = workflow['jobs']['guard']['steps']
          if len(steps) != 6:
              raise RuntimeError('Unexpected base policy layout')
          chunks = []
          for index, step in enumerate(steps[2:5]):
              operator = '>' if index == 0 else '>>'
              prefix = (
                  'set -euo pipefail\n'
                  f'cat <<\'POLICY_SOURCE\' {operator} "$RUNNER_TEMP/policy_guard.py"\n'
              )
              suffix = 'POLICY_SOURCE\n'
              script = step['run']
              if not script.startswith(prefix) or not script.endswith(suffix):
                  raise RuntimeError('Unexpected base policy source wrapper')
              chunks.append(script[len(prefix):-len(suffix)])
          checker = root / 'base-policy.py'
          checker.write_text(''.join(chunks))
          subprocess.run(['python3', str(checker)], check=True)
          PY
