name: dependabot preparation
run-name: 'Prepare dependencies #${{ inputs.number }} at ${{ inputs.expected_head }}'

on:
  workflow_dispatch:
    inputs:
      number:
        description: Dependabot PR number
        required: true
      expected_head:
        description: Expected Dependabot commit
        required: true

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dependabot-preparation-${{ inputs.number }}
  cancel-in-progress: false

jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      base: ${{ steps.inspect.outputs.base }}
      head: ${{ steps.inspect.outputs.head }}
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dependabot/fetch-metadata
          ref: 25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
          path: metadata-action
          sparse-checkout: dist
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        id: inspect
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.number }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        with:
          script: |
            const { inspect } = require('./.github/scripts/dependabot-preparation.cjs');
            const { fetchMetadata, preparationEligibility } = require('./.github/scripts/dependabot-auto-merge.cjs');
            const { pull, paths } = await inspect(github, context, Number(process.env.PR_NUMBER), process.env.EXPECTED_HEAD);
            const deps = paths.length === 1 ? null : fetchMetadata(pull, `${context.repo.owner}/${context.repo.repo}`, require('node:path').resolve('metadata-action'));
            const reason = paths.length === 1 ? null : preparationEligibility(deps);
            if (reason) throw new Error(reason);
            core.setOutput('base', pull.base.sha);
            core.setOutput('head', pull.head.sha);

  build:
    if: github.ref == 'refs/heads/main'
    needs: inspect
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.inspect.outputs.head }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: |
            source/npm-shrinkwrap.json
            source/src/upstream/coding-agents/npm-shrinkwrap.json
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - name: Install npm packaging client
        run: |
          npm install --global npm@11.19.1 --ignore-scripts --no-audit --no-fund
          test "$(npm --version)" = 11.19.1
      - name: Regenerate dependency artifacts
        env:
          PR_NUMBER: ${{ inputs.number }}
          EXPECTED_HEAD: ${{ needs.inspect.outputs.head }}
          EXPECTED_BASE: ${{ needs.inspect.outputs.base }}
        run: >-
          node automation/.github/scripts/refresh-dependency-artifacts.cjs
          source "$PR_NUMBER" "$EXPECTED_HEAD" "$EXPECTED_BASE" "$RUNNER_TEMP/dependency-artifacts.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-artifacts
          path: ${{ runner.temp }}/dependency-artifacts.json
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.ref == 'refs/heads/main'
    needs: [inspect, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release-automation
    permissions:
      contents: read
      pull-requests: read
      checks: write
      actions: write
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dependabot/fetch-metadata
          ref: 25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
          path: metadata-action
          sparse-checkout: dist
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dependency-artifacts
          path: generated
      - name: Scoped Release App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Publish generated files
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          GH_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.app.outputs.token }}
          PR_NUMBER: ${{ inputs.number }}
          EXPECTED_HEAD: ${{ needs.inspect.outputs.head }}
          EXPECTED_BASE: ${{ needs.inspect.outputs.base }}
        with:
          script: |
            const fs = require('node:fs');
            if (fs.statSync('generated/dependency-artifacts.json').size > 64 * 1024 * 1024) throw new Error('Oversized preparation artifact');
            const payload = JSON.parse(fs.readFileSync('generated/dependency-artifacts.json', 'utf8'));
            if (payload.number !== Number(process.env.PR_NUMBER) || payload.head !== process.env.EXPECTED_HEAD || payload.base !== process.env.EXPECTED_BASE) throw new Error('Preparation identity mismatch');
            const { publish } = require('./.github/scripts/dependabot-preparation.cjs');
            const sha = await publish(github, context, payload, require('node:path').resolve('metadata-action'), undefined, getOctokit(process.env.APP_TOKEN));
            const { data: pull } = await github.rest.pulls.get({ ...context.repo, pull_number: payload.number });
            if (pull.head.sha !== sha) throw new Error('PR changed after publication');
            const { requestValidation } = require('./.github/scripts/dependabot-validation.cjs');
            await requestValidation(github, context, pull, core);
            // Re-evaluate promptly after publication; the scheduled refresh may be delayed.
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'dependabot-auto-merge-refresh.yml',
              ref: pull.base.ref,
            });
            core.info(`#${pull.number}: requested auto-merge refresh after preparation`);

