name: dependabot preparation
run-name: 'Prepare dependencies #${{ inputs.number }} at ${{ inputs.expected_head }}'

on:
  workflow_dispatch:
    inputs:
      number:
        description: Dependabot PR number
        required: true
      expected_head:
        description: Expected Dependabot commit
        required: true

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dependabot-preparation-${{ inputs.number }}
  cancel-in-progress: false

jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.inspect.outputs.base }}
      head: ${{ steps.inspect.outputs.head }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dependabot/fetch-metadata
          ref: 25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
          path: metadata-action
          sparse-checkout: dist
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        id: inspect
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.number }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        with:
          script: |
            const { inspect } = require('./.github/scripts/dependabot-preparation.cjs');
            const { fetchMetadata, updateEligibility } = require('./.github/scripts/dependabot-auto-merge.cjs');
            const { pull } = await inspect(github, context, Number(process.env.PR_NUMBER), process.env.EXPECTED_HEAD);
            const deps = fetchMetadata(pull, `${context.repo.owner}/${context.repo.repo}`, require('node:path').resolve('metadata-action'));
            const reason = updateEligibility(deps);
            if (reason) throw new Error(reason);
            core.setOutput('base', pull.base.sha);
            core.setOutput('head', pull.head.sha);

  build:
    if: github.ref == 'refs/heads/main'
    needs: inspect
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.inspect.outputs.head }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.20.0
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Regenerate dependency artifacts
        env:
          PR_NUMBER: ${{ inputs.number }}
          EXPECTED_HEAD: ${{ needs.inspect.outputs.head }}
          EXPECTED_BASE: ${{ needs.inspect.outputs.base }}
        run: >-
          node automation/.github/scripts/refresh-dependency-artifacts.cjs
          source "$PR_NUMBER" "$EXPECTED_HEAD" "$EXPECTED_BASE" "$RUNNER_TEMP/dependency-artifacts.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-artifacts
          path: ${{ runner.temp }}/dependency-artifacts.json
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.ref == 'refs/heads/main'
    needs: [inspect, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      checks: write
      actions: write
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dependabot/fetch-metadata
          ref: 25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
          path: metadata-action
          sparse-checkout: dist
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dependency-artifacts
          path: generated
      - name: Publish generated files
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.number }}
          EXPECTED_HEAD: ${{ needs.inspect.outputs.head }}
          EXPECTED_BASE: ${{ needs.inspect.outputs.base }}
        with:
          script: |
            const fs = require('node:fs');
            if (fs.statSync('generated/dependency-artifacts.json').size > 64 * 1024 * 1024) throw new Error('Oversized preparation artifact');
            const payload = JSON.parse(fs.readFileSync('generated/dependency-artifacts.json', 'utf8'));
            if (payload.number !== Number(process.env.PR_NUMBER) || payload.head !== process.env.EXPECTED_HEAD || payload.base !== process.env.EXPECTED_BASE) throw new Error('Preparation identity mismatch');
            const { publish } = require('./.github/scripts/dependabot-preparation.cjs');
            const sha = await publish(github, context, payload, require('node:path').resolve('metadata-action'));
            const { data: pull } = await github.rest.pulls.get({ ...context.repo, pull_number: payload.number });
            if (pull.head.sha !== sha) throw new Error('PR changed after publication');
            const { requestValidation } = require('./.github/scripts/dependabot-validation.cjs');
            await requestValidation(github, context, pull, core);
