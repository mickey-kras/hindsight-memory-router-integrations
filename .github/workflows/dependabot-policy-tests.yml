name: dependabot policy tests

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  policy-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node --test .github/scripts/dependabot-auto-merge.test.cjs
