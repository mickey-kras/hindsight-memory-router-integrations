name: branch-policy

on:
  workflow_call:

permissions:
  contents: read

env:
  WORK_BRANCH_RE: '^(feat|fix|refactor|docs|ci|security)/[a-z0-9]+(-[a-z0-9]+)*$'

jobs:
  branch-name:
    name: branch name
    runs-on: ubuntu-latest
    steps:
      - name: Validate same-repository branch name
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.head_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.inputs.number }}
          EXPECTED_HEAD: ${{ github.event.inputs.expected_head }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
            [[ "$EXPECTED_HEAD" == "$GITHUB_SHA" ]]
            pull="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"
            jq -e --arg sha "$GITHUB_SHA" --arg ref "$GITHUB_REF_NAME" --arg repo "$REPOSITORY" '
              .state == "open" and .draft == false and
              .head.sha == $sha and .head.ref == $ref and .head.repo.full_name == $repo and
              .base.ref == "main" and .user.login == "dependabot[bot]" and .user.id == 49699333
            ' <<< "$pull" > /dev/null
            HEAD_REPO="$(jq -r '.head.repo.full_name' <<< "$pull")"
            HEAD_REF="$(jq -r '.head.ref' <<< "$pull")"
            PR_AUTHOR="$(jq -r '.user.login' <<< "$pull")"
          fi

          if [[ "$HEAD_REPO" != "$REPOSITORY" ]]; then
            exit 0
          fi

          if [[ "$PR_AUTHOR" == "dependabot[bot]" && "$HEAD_REF" == dependabot/* ]]; then
            exit 0
          fi

          if [[ ! "$HEAD_REF" =~ $WORK_BRANCH_RE ]]; then
            echo "Branch must match: $WORK_BRANCH_RE" >&2
            exit 1
          fi
