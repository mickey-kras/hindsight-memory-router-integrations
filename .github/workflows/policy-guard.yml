          def gate_release_source(path, content):
              expected = RELEASE_SOURCE_HASHES[path]
              if isinstance(expected, str): expected = (expected,)
              if hashlib.sha256(content.encode()).hexdigest() not in expected and not review_admitted:
                  fail(f'{path}: release automation must match its reviewed policy')
          def gate_review_controls(path, content):
              if content != base_file(path) and not review_admitted:
                  fail(f'{path}: review controls require independent exact-head owner approval')

          GATES = {
              '.github/CODEOWNERS': gate_review_controls,
              '.github/rulesets/require-ci-owner-review.json': gate_review_controls,
              '.github/workflows/aislop.yml': gate_aislop,
              '.github/workflows/codeql.yml': gate_codeql,
