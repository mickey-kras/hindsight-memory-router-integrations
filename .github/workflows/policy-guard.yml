          def unique_json(content):
              def pairs(items):
                  result = {}
                  for key, value in items:
                      if key in result:
                          raise ValueError(f'duplicate JSON key: {key}')
                      result[key] = value
                  return result
              return json.loads(content, object_pairs_hook=pairs)

          def api_json(suffix, paginate=False):
              args = ['gh', 'api', f'repos/{os.environ["OWNER"]}/{os.environ["REPO"]}/{suffix}']
              if paginate:
                  args += ['--paginate', '--slurp']
              result = subprocess.run(args, capture_output=True, text=True, check=True, timeout=60)
              data = unique_json(result.stdout)
              if paginate:
                  if not isinstance(data, list) or any(not isinstance(page, list) for page in data):
                      raise ValueError('invalid paginated API response')
                  return [item for page in data for item in page]
              return data

