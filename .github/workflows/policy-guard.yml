        run: |
          set -euo pipefail
          cat <<'POLICY_SOURCE' >> "$RUNNER_TEMP/policy_guard.py"
              '.github/scripts/npm-audit.cjs': gate_npm_audit_script,
              '.github/scripts/sync-sonar-findings.py': gate_sonar_reporter,
              '.github/scripts/publish-npm.cjs': gate_review_controls,
              '.github/trusted-ci/publish-npm.test.cjs': gate_review_controls,
              '.github/scripts/verify-package-inventory.cjs': gate_review_controls,
              '.github/scripts/coding-dependency-patch.cjs': gate_review_controls,
              '.semgrep.yml': gate_semgrep,
              '.github/dependabot.yml': gate_dependabot,
              'package.json': gate_package_json,
              'vitest.config.ts': gate_vitest,
              'sonar-project.properties': gate_sonar,
              'PACKAGE_SHA256': gate_checksum_file,
              'PACKAGE_NIX_HASHES': gate_checksum_file,
          }
          # Reviewed whole-workflow shapes replace the former detailed dispatch for
          # automation workflows; do not shadow an independently active gate.
          assert not (GATES.keys() & AUTOMATION_SHAPES.keys())
          GATES.update({path: gate_automation for path in AUTOMATION_SHAPES})
          GATES.update({path: gate_release_source for path in RELEASE_SOURCE_HASHES})
          GATES.update({path: gate_lockfile for path in LOCKFILES})
          GATES.update({path: gate_dependency_preparation for path in DEPENDABOT_SOURCE_CONTRACTS})
          # The publish job loads this helper through verify-package-inventory.cjs.
          def gate_publish_dependency(path, content):
              gate_dependency_preparation(path, content)
              gate_review_controls(path, content)
          GATES['.github/scripts/dependency-files.cjs'] = gate_publish_dependency
          protected = set(GATES)
          def load_files():
              with open(os.environ['FILES_JSON'], encoding='utf-8') as handle:
                  data = json.load(handle)
              if not isinstance(data, list):
                  raise RuntimeError('files.json must contain a JSON array')
              entries = []
              for item in data:
                  if isinstance(item, list):
                      entries.extend(item)
                  else:
                      entries.append(item)
              files = []
              for entry in entries:
                  if not isinstance(entry, dict) or not isinstance(entry.get('filename'), str):
                      raise RuntimeError('files.json entries must be objects with a filename')
                  files.append(entry)
              return files
          TRUSTED_ASSOCIATIONS = {'OWNER', 'MEMBER', 'COLLABORATOR'}
          DEPENDABOT_LOGIN = 'dependabot[bot]'
          def resolve_pr_context():
              global pr_context
              fixture_dir = os.environ.get('GUARD_FIXTURE_DIR')
              if fixture_dir:
                  values = {}
                  for field in ('head_sha', 'author_association', 'author_login'):
                      marker = os.path.join(fixture_dir, field)
                      if not os.path.isfile(marker):
                          raise RuntimeError(f'{field}: fixture file missing')
                      with open(marker, encoding='utf-8') as handle:
                          values[field] = handle.read().strip()
                  sha = values['head_sha']
                  association = values['author_association']
                  login = values['author_login']
                  pr_context = {'head': {'sha': sha}, 'user': {'login': login, 'type': 'User'}}
              else:
                  result = subprocess.run(
                      [
                          'gh', 'api',
                          f'repos/{os.environ["OWNER"]}/{os.environ["REPO"]}/pulls/{os.environ["PR_NUMBER"]}',
                      ],
                      capture_output=True,
                      text=True,
                  )
                  if result.returncode != 0:
                      raise RuntimeError(f'failed to resolve pull request: {result.stderr.strip()}')
                  try:
                      payload = json.loads(result.stdout)
                  except json.JSONDecodeError as exc:
                      raise RuntimeError(f'unexpected pull request response: {exc}') from exc
                  if not isinstance(payload, dict):
                      raise RuntimeError('unexpected pull request response')
                  pr_context = payload
                  head = payload.get('head')
                  sha = head.get('sha') if isinstance(head, dict) else None
                  association = payload.get('author_association')
                  user = payload.get('user')
                  login = user.get('login') if isinstance(user, dict) else None
              if not isinstance(sha, str) or not re.fullmatch(r'[0-9a-f]{40}', sha):
                  raise RuntimeError('unexpected pull request head sha')
              return sha, str(association or ''), str(login or '')
          def fetch_file(path, head_sha):
              fixture_dir = os.environ.get('GUARD_FIXTURE_DIR')
              if fixture_dir:
                  local = os.path.join(fixture_dir, path)
                  if not os.path.isfile(local):
                      raise RuntimeError(f'{path}: fixture file missing')
                  with open(local, encoding='utf-8') as handle:
                      content = handle.read()
              else:
                  result = subprocess.run(
                      [
                          'gh', 'api',
                          f'repos/{os.environ["OWNER"]}/{os.environ["REPO"]}/contents/{path}?ref={head_sha}',
                          '-H', 'Accept: application/vnd.github.raw',
                      ],
                      capture_output=True,
                      text=True,
                  )
                  if result.returncode != 0:
                      raise RuntimeError(f'{path}: failed to fetch at head: {result.stderr.strip()}')
                  content = result.stdout
              # Only explicitly hash-pinned empty ignore lists may be empty.
              if not content.strip() and not (content == '' and RELEASE_SOURCE_HASHES.get(path) == hashlib.sha256(b'').hexdigest()):
                  raise RuntimeError(f'{path}: empty content at head')
              return content
          def main():
              global review_admitted
              head_sha, author_association, author_login = resolve_pr_context()
              review_admitted = owner_approved()
              files = load_files() if os.environ.get('GUARD_FIXTURE_DIR') else api_json(f'pulls/{os.environ["PR_NUMBER"]}/files?per_page=100', paginate=True)
              if len(files) >= 3000:
                  fail(
                      f'changed-file list has {len(files)} entries; '
                      'the file list may be truncated by the API'
                  )
              removed_or_renamed = set()
              changed = set()
              for entry in files:
                  filename = entry['filename']
                  changed.add(filename)
                  previous = entry.get('previous_filename')
                  if isinstance(previous, str):
                      changed.add(previous)
                  if entry.get('status') == 'removed':
                      removed_or_renamed.add(filename)
                  if entry.get('status') == 'renamed' and isinstance(previous, str):
                      removed_or_renamed.add(previous)
              forbidden_npm = {'.npmrc', '.github/.npmrc'} | {path.rsplit('/', 1)[0] + suffix for path in LOCKFILES for suffix in ('/.npmrc', '/npm-shrinkwrap.json')}
              if changed & forbidden_npm:
                  fail('CI npm configuration and shadow shrinkwrap files must not change')
              protected_package_change = any(path.startswith('packages/') for path in changed)
              if changed & protected or protected_package_change:
                  if (
                      author_association.upper() not in TRUSTED_ASSOCIATIONS
                      and author_login != DEPENDABOT_LOGIN
                      and not review_admitted
                  ):
                      fail(
                          'protected gate files changed by an untrusted author '
                          f'(author_association={author_association or "unknown"}, '
                          f'login={author_login or "unknown"}); require OWNER, MEMBER or '
                          'COLLABORATOR, or dependabot[bot]'
                      )
              if not review_admitted and changed & set(DEPENDABOT_SOURCE_CONTRACTS) and (
                  author_association.upper() not in TRUSTED_ASSOCIATIONS or author_login.endswith('[bot]')
              ):
                  fail('Dependabot automation source changes require a trusted human author: OWNER, MEMBER or COLLABORATOR')
              for path in sorted(protected & removed_or_renamed):
                  fail(f'{path}: protected gate file must not be removed or renamed')
              for entry in files:
                  path = entry['filename']
                  if entry.get('status') == 'removed':
                      continue
                  if not path.startswith('.github/workflows/') or not re.search(r'\.ya?ml$', path, re.I):
                      continue
                  doc = parse_yaml_file(path, fetch_file(path, head_sha), 'workflow')
                  if doc is not None:
                      check_workflow(path, doc)
              for path in sorted(protected):
                  if path not in changed or path in removed_or_renamed:
                      continue
                  GATES[path](path, fetch_file(path, head_sha))
              if not os.environ.get('GUARD_FIXTURE_DIR'):
                  current = api_json(f'pulls/{os.environ["PR_NUMBER"]}')
                  if current.get('state') != 'open' or current.get('head', {}).get('sha') != head_sha or current.get('base', {}).get('sha') != pr_context.get('base', {}).get('sha'):
                      fail('pull request changed during evaluation; rerun guard')
              if failures:
                  print('Policy guard failed:')
                  for message in failures:
                      print(f'- {message}')
                  sys.exit(1)
              print('Policy guard passed.')
          if __name__ == '__main__':
              try:
                  main()
              except SystemExit:
                  raise
              except Exception:
                  traceback.print_exc()
                  sys.exit(1)
          POLICY_SOURCE

      - name: policy guard
        env:
