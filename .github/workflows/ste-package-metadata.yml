name: STE package metadata
on: pull_request
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.3
      - name: Select npm
        run: |
          npm install --global npm@11.19.1 --ignore-scripts --no-audit --no-fund
          test "$(npm --version)" = 11.19.1
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix src/upstream/coding-agents --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm run build --prefix src/upstream/coding-agents
      - name: Print package hashes
        run: |
          mkdir -p packages
          npm pack --ignore-scripts --pack-destination packages
          npm pack ./src/upstream/coding-agents --ignore-scripts --pack-destination packages
          sha256sum packages/*.tgz
