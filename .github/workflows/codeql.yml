name: codeql

on:
  workflow_call:
    inputs:
      candidate_ref:
        type: string
        default: ''
      candidate_sha:
        type: string
        default: ''
  schedule:
    - cron: "31 3 * * 1"

concurrency:
  group: codeql-${{ github.event_name }}-${{ inputs.candidate_sha || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          persist-credentials: false

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: .github/workflows/main.yml:analyze
          ref: ${{ inputs.candidate_ref }}
          sha: ${{ inputs.candidate_sha }}
