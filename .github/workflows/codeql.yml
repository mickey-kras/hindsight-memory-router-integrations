name: codeql
'on':
  workflow_call:
    inputs:
      candidate_ref:
        type: string
        default: ''
      candidate_sha:
        type: string
        default: ''
  schedule:
    - cron: 31 3 * * 1
permissions:
  contents: read
  pull-requests: read
  security-events: write
jobs:
  analyze:
    uses: ./.github/workflows/trusted-codeql.yml
    with:
      revision_sha: ${{ inputs.candidate_sha }}
      revision_ref: ${{ inputs.candidate_ref }}
