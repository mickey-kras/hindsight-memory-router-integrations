name: main

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    name: quality
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/ci.yml

  aislop:
    name: aislop
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/aislop.yml

  codeql:
    name: codeql
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql.yml

  sonar:
    name: sonar
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    needs: [quality, aislop, codeql]
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Connect to the tailnet
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TAILSCALE_AUDIENCE }}
          tags: tag:github-sonar
          use-cache: 'true'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: npm-shrinkwrap.json

      - run: npm ci
      - name: Generate coverage for SonarQube
        run: npm run test:coverage

      - name: SonarQube analysis
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube quality gate
        timeout-minutes: 6
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1
        with:
          pollingTimeoutSec: 270
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

