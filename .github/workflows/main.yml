name: main

on:
  workflow_call:
    secrets:
      RELEASE_APP_PRIVATE_KEY:
        required: false
  workflow_dispatch:
    inputs:
      create_release:
        description: Create a pinned release branch and automatically release after checks
        type: boolean
        default: false
  push:
    branches: [main]

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.create_release && format('dependabot-auto-merge-{0}', github.repository) || format('main-{0}', github.ref) }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update-pr-branches:
    name: update PR branches
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/pr-branch-updater.yml

  quality:
    name: quality
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/ci.yml

  aislop:
    name: aislop
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/aislop.yml

  codeql:
    name: codeql
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql.yml

  sonar:
    name: sonar
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
      issues: write
    needs: [quality, aislop, codeql]
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Connect to the tailnet
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TAILSCALE_AUDIENCE }}
          tags: tag:github-sonar
          use-cache: 'true'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.20.0
          cache: npm
          cache-dependency-path: npm-shrinkwrap.json

      - run: npm ci
      - run: npm ci --prefix src/upstream/coding-agents
      - name: Generate coverage for SonarQube
        run: npm run test:coverage

      - name: SonarQube analysis
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube quality gate
        id: sonar-quality-gate
        timeout-minutes: 6
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1
        with:
          pollingTimeoutSec: 270
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Synchronize SonarQube findings
        if: failure() && steps.sonar-quality-gate.outcome == 'failure' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: python3 .github/scripts/sync-sonar-findings.py .scannerwork/report-task.txt

  prepare-release:
    name: create release branch
    needs: [quality, aislop, codeql, sonar]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.create_release
    runs-on: ubuntu-latest
    environment: release-automation
    concurrency:
      group: release-preparation-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      RELEASE_APP_ID: ${{ vars.RELEASE_APP_ID }}
      RELEASE_SETTINGS_REVIEW: ${{ vars.RELEASE_SETTINGS_REVIEW }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.20.0
      - name: Build and verify packages
        # packages/ is gitignored; release inputs freeze the CI-reproducible
        # package bytes pinned by PACKAGE_SHA256, not committed binaries.
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix src/upstream/coding-agents --ignore-scripts --no-audit --no-fund
          npm ci --prefix src/mcp --ignore-scripts --no-audit --no-fund
          npm install --global npm@11.19.1 --ignore-scripts --no-audit --no-fund
          npm run build
          npm run build:coding-agents
          npm run build --prefix src/mcp
          mkdir -p packages
          npm pack --pack-destination packages --silent
          (cd src/upstream/coding-agents && npm pack --pack-destination "$GITHUB_WORKSPACE/packages" --silent)
          npm pack ./src/mcp --pack-destination packages --silent
          sha256sum --check PACKAGE_SHA256
      - name: Install release tools
        run: npm ci --prefix .github/scripts --ignore-scripts --no-audit --no-fund
      - name: Release App token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Freeze inputs and create release branch
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: await require('./.github/scripts/release.cjs').prepare({ github, context, core });

  publish:
    name: publish packages
    needs: [quality, aislop, codeql]
    if: startsWith(github.ref, 'refs/heads/release/')
    outputs:
      released: ${{ steps.finalized.outputs.latest }}
    runs-on: ubuntu-latest
    environment: release-automation
    concurrency:
      group: package-release-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      RELEASE_APP_ID: ${{ vars.RELEASE_APP_ID }}
      RELEASE_SETTINGS_REVIEW: ${{ vars.RELEASE_SETTINGS_REVIEW }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.20.0
      - name: Build and verify packages
        # packages/ is gitignored; the release publishes and attests the
        # CI-reproducible package bytes pinned by PACKAGE_SHA256.
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix src/upstream/coding-agents --ignore-scripts --no-audit --no-fund
          npm ci --prefix src/mcp --ignore-scripts --no-audit --no-fund
          npm install --global npm@11.19.1 --ignore-scripts --no-audit --no-fund
          npm run build
          npm run build:coding-agents
          npm run build --prefix src/mcp
          mkdir -p packages
          npm pack --pack-destination packages --silent
          (cd src/upstream/coding-agents && npm pack --pack-destination "$GITHUB_WORKSPACE/packages" --silent)
          npm pack ./src/mcp --pack-destination packages --silent
          sha256sum --check PACKAGE_SHA256
      - name: Release preflight
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: await require('./.github/scripts/release.cjs').validate({ github, context, core });

      - name: Attest tested packages
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: packages/*.tgz
          create-storage-record: true
      - name: Install release tools
        run: npm ci --prefix .github/scripts --ignore-scripts --no-audit --no-fund
      - name: Release App token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Publish immutable release
        id: finalized
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: await require('./.github/scripts/release.cjs').finalize({ github, context, core });

  cleanup:
    name: clean up failed release
    needs: [quality, aislop, codeql, publish, prepare-release]
    if: >-
      ${{
        always() &&
        (
          (
            startsWith(github.ref, 'refs/heads/release/') &&
            needs.publish.outputs.released == '' &&
            (
              needs.quality.result == 'failure' ||
              needs.aislop.result == 'failure' ||
              needs.codeql.result == 'failure' ||
              needs.publish.result == 'failure'
            )
          ) ||
          (
            github.event_name == 'workflow_dispatch' &&
            github.ref == 'refs/heads/main' &&
            inputs.create_release &&
            needs.prepare-release.result == 'failure'
          )
        )
      }}
    runs-on: ubuntu-latest
    continue-on-error: true
    environment: release-automation
    concurrency:
      group: package-release-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Release App token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Delete the failed release branch
        if: startsWith(github.ref, 'refs/heads/release/')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: await require('./.github/scripts/release-cleanup.cjs').branch({ github, context, core });
      - name: Delete failed preparation branches
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: await require('./.github/scripts/release-cleanup.cjs').preparation({ github, context, core });
