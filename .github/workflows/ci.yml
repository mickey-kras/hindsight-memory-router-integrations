name: ci

on:
  workflow_call:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  security-events: write

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.20.0
          cache: npm
          cache-dependency-path: npm-shrinkwrap.json

      - run: npm ci
      - run: npm ci --prefix src/upstream/coding-agents
      - run: npm run lint
      - run: npm run typecheck
      - name: Tests and coverage
        run: npm run test:coverage
      - run: npm run build
      - run: npm run build:coding-agents
      - run: npm exec --prefix src/upstream/coding-agents -- tsc --noEmit -p src/upstream/coding-agents/tsconfig.json
      - run: npm test --prefix src/upstream/coding-agents
      - run: node scripts/verify-coding-upstream.mjs
      - run: node scripts/verify-openclaw-overlay.mjs
      - run: node --test scripts/verify-vendored-files.test.mjs
      - name: PR branch updater tests
        run: node --test .github/scripts/pr-branch-updater.test.cjs
      - name: Node tooling audit
        run: |
          node --test .github/scripts/npm-audit.test.cjs
          node .github/scripts/npm-audit.cjs
          node .github/scripts/npm-audit.cjs src/upstream/coding-agents

      - name: Verify package
        run: |
          artifact="$(npm pack --pack-destination "$RUNNER_TEMP" --json | jq -r '.[0].filename')"
          tar -tzf "$RUNNER_TEMP/$artifact" > "$RUNNER_TEMP/package-files"
          grep -Fxq package/npm-shrinkwrap.json "$RUNNER_TEMP/package-files"
          mkdir "$RUNNER_TEMP/generated-root" "$RUNNER_TEMP/committed-root"
          tar -xzf "$RUNNER_TEMP/$artifact" -C "$RUNNER_TEMP/generated-root"
          tar -xzf "packages/$artifact" -C "$RUNNER_TEMP/committed-root"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -cf "$RUNNER_TEMP/generated-root.tar" -C "$RUNNER_TEMP/generated-root" .
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -cf "$RUNNER_TEMP/committed-root.tar" -C "$RUNNER_TEMP/committed-root" .
          cmp "$RUNNER_TEMP/generated-root.tar" "$RUNNER_TEMP/committed-root.tar"
          coding_artifact="$(cd src/upstream/coding-agents && npm pack --pack-destination "$RUNNER_TEMP" --json | jq -r '.[0].filename')"
          mkdir "$RUNNER_TEMP/generated-coding" "$RUNNER_TEMP/committed-coding"
          tar -xzf "$RUNNER_TEMP/$coding_artifact" -C "$RUNNER_TEMP/generated-coding"
          tar -xzf "packages/$coding_artifact" -C "$RUNNER_TEMP/committed-coding"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -cf "$RUNNER_TEMP/generated-coding.tar" -C "$RUNNER_TEMP/generated-coding" .
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -cf "$RUNNER_TEMP/committed-coding.tar" -C "$RUNNER_TEMP/committed-coding" .
          cmp "$RUNNER_TEMP/generated-coding.tar" "$RUNNER_TEMP/committed-coding.tar"
          sha256sum --check PACKAGE_SHA256

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Nix dependency hash
        run: |
          artifact="packages/$(npm pack --dry-run --json | jq -r '.[0].filename')"
          expected_source="$(sed -n 's/^source=//p' PACKAGE_NIX_HASHES)"
          expected_deps="$(sed -n 's/^npm_deps=//p' PACKAGE_NIX_HASHES)"
          test "$(nix hash file "$artifact")" = "$expected_source"
          actual_deps="$(
            nix run github:NixOS/nixpkgs/e7a3ca8092b61ff85b6a45bf863ea2b2d6a661b3#prefetch-npm-deps \
              -- npm-shrinkwrap.json
          )"
          printf 'expected npm dependency hash: %s\nactual npm dependency hash:   %s\n' \
            "$expected_deps" "$actual_deps"
          test "$actual_deps" = "$expected_deps"

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Semgrep
        run: |
          SEMGREP_IMAGE="semgrep/semgrep:1.172.0@sha256:65dcd4408adda7c183a6b4550cb1e9b19f7f627a6fbb7e0559bd466bedc44d7b"
          docker pull "$SEMGREP_IMAGE"
          docker run --rm \
            -v "${PWD}:/src" \
            -w /src \
            "$SEMGREP_IMAGE" \
            semgrep scan --config .semgrep.yml --exclude .semgrep.yml --error

      - name: Trivy dependency report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: sarif
          output: trivy-results.sarif
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: 0
          limit-severities-for-sarif: true
          skip-dirs: .cache,node_modules,coverage,dist
          version: v0.71.2

      - name: Verify Trivy SARIF
        run: test -s trivy-results.sarif

      - name: Upload Trivy SARIF
        if: >-
          ${{
            github.event_name != 'pull_request' ||
            github.event.pull_request.head.repo.full_name == github.repository
          }}
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-results.sarif
          category: .github/workflows/main.yml:trivy

      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.71.2

      - name: Trivy dependency gate
        run: >-
          trivy fs --scanners vuln --exit-code 1 --severity HIGH,CRITICAL
          --ignore-unfixed --skip-dirs .cache --skip-dirs node_modules
          --skip-dirs coverage --skip-dirs dist .
