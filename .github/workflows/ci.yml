name: ci
'on':
  workflow_call:
    inputs:
      candidate_ref:
        type: string
        default: ''
      candidate_sha:
        type: string
        default: ''
    outputs:
      coverage_artifact:
        value: ${{ jobs.checks.outputs.coverage_artifact }}
permissions:
  contents: read
  pull-requests: read
  security-events: write
jobs:
  checks:
    uses: ./.github/workflows/trusted-ci.yml
    with:
      revision_sha: ${{ inputs.candidate_sha }}
      revision_ref: ${{ inputs.candidate_ref }}
