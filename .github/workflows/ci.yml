name: ci

on:
  workflow_call:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  security-events: write

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.20.0
          cache: npm
          cache-dependency-path: npm-shrinkwrap.json

      - run: npm ci
      - run: npm ci --prefix src/upstream/coding-agents
      - run: npm ci --prefix src/mcp
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - name: Tests and coverage
        run: npm run test:coverage
      - run: npm run build
      - run: npm run build:coding-agents
      - run: npm run build --prefix src/mcp
      - run: npm exec --prefix src/upstream/coding-agents -- tsc --noEmit -p src/upstream/coding-agents/tsconfig.json
      - run: npm test --prefix src/upstream/coding-agents
      - run: node scripts/verify-coding-upstream.mjs
      - run: node scripts/verify-openclaw-overlay.mjs
      - run: node --test scripts/verify-vendored-files.test.mjs
      - name: Install supported audit client
        # npm < 11 audits through the retired /audits/quick endpoint (HTTP 400
        # "endpoint is being retired"); npm 11 queries the supported bulk
        # advisory endpoint. Upgrade once so every later audit step benefits.
        run: npm install --global npm@11.19.1 --ignore-scripts --no-audit --no-fund
      - name: Install release tools
        run: npm ci --prefix .github/scripts --ignore-scripts --no-audit --no-fund
      - name: Audit release tools
        run: |
          # Retry only shields transient registry errors; the endpoint
          # retirement itself is handled by the npm 11 upgrade above.
          for attempt in 1 2 3; do
            if npm audit --prefix .github/scripts --audit-level=moderate; then exit 0; fi
            echo "npm audit attempt $attempt failed; retrying"
            sleep $((attempt * 15))
          done
          exit 1
      - name: Release automation tests
        run: node --test .github/scripts/release.test.cjs .github/scripts/combination.test.cjs .github/scripts/release-cleanup.test.cjs
      - name: Release policy tests
        run: python3 .github/scripts/release-policy.test.py

      - name: PR branch updater tests
        run: node --test .github/scripts/pr-branch-updater.test.cjs
      - name: Sonar finding reporter tests
        run: python3 -m unittest tests/test_sonar_finding_sync.py
      - name: Node tooling audit
        run: |
          node --test .github/scripts/npm-audit.test.cjs
          node .github/scripts/npm-audit.cjs
          node .github/scripts/npm-audit.cjs src/upstream/coding-agents

      - name: MCP tooling audit
        run: node .github/scripts/npm-audit.cjs src/mcp

      - name: Verify package
        # packages/ is gitignored: tarballs are CI-built, never committed.
        # Reproducibility is enforced twice: each package is packed twice and
        # byte-compared, and the pinned hashes in PACKAGE_SHA256 must match the
        # freshly packed bytes.
        run: |
          mkdir -p packages "$RUNNER_TEMP/repack"
          artifact="$(npm pack --pack-destination packages --json | jq -r '.[0].filename')"
          tar -tzf "packages/$artifact" > "$RUNNER_TEMP/package-files"
          grep -Fxq package/npm-shrinkwrap.json "$RUNNER_TEMP/package-files"
          repeat="$(npm pack --pack-destination "$RUNNER_TEMP/repack" --json | jq -r '.[0].filename')"
          test "$artifact" = "$repeat"
          cmp "packages/$artifact" "$RUNNER_TEMP/repack/$repeat"
          coding_artifact="$(cd src/upstream/coding-agents && npm pack --pack-destination "$GITHUB_WORKSPACE/packages" --json | jq -r '.[0].filename')"
          coding_repeat="$(cd src/upstream/coding-agents && npm pack --pack-destination "$RUNNER_TEMP/repack" --json | jq -r '.[0].filename')"
          test "$coding_artifact" = "$coding_repeat"
          cmp "packages/$coding_artifact" "$RUNNER_TEMP/repack/$coding_repeat"
          mcp_artifact="$(npm pack ./src/mcp --pack-destination packages --json | jq -r '.[0].filename')"
          tar -tzf "packages/$mcp_artifact" | grep -Fxq package/npm-shrinkwrap.json
          mcp_repeat="$(npm pack ./src/mcp --pack-destination "$RUNNER_TEMP/repack" --json | jq -r '.[0].filename')"
          test "$mcp_artifact" = "$mcp_repeat"
          cmp "packages/$mcp_artifact" "$RUNNER_TEMP/repack/$mcp_repeat"
          node .github/scripts/verify-package-inventory.cjs
          sha256sum --check PACKAGE_SHA256

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Nix dependency hash
        run: |
          artifact="$(npm pack --pack-destination "$RUNNER_TEMP" --json | jq -r '.[0].filename')"
          expected_source="$(sed -n 's/^source=//p' PACKAGE_NIX_HASHES)"
          expected_deps="$(sed -n 's/^npm_deps=//p' PACKAGE_NIX_HASHES)"
          test "$(nix hash file "$RUNNER_TEMP/$artifact")" = "$expected_source"
          actual_deps="$(
            nix run github:NixOS/nixpkgs/e7a3ca8092b61ff85b6a45bf863ea2b2d6a661b3#prefetch-npm-deps \
              -- npm-shrinkwrap.json
          )"
          printf 'expected npm dependency hash: %s\nactual npm dependency hash:   %s\n' \
            "$expected_deps" "$actual_deps"
          test "$actual_deps" = "$expected_deps"

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Semgrep
        run: |
          SEMGREP_IMAGE="semgrep/semgrep:1.172.0@sha256:65dcd4408adda7c183a6b4550cb1e9b19f7f627a6fbb7e0559bd466bedc44d7b"
          docker pull "$SEMGREP_IMAGE"
          docker run --rm \
            -v "${PWD}:/src" \
            -w /src \
            "$SEMGREP_IMAGE" \
            semgrep scan --config .semgrep.yml --exclude .semgrep.yml --error

      - name: Trivy dependency report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: sarif
          output: trivy-results.sarif
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: 0
          limit-severities-for-sarif: true
          skip-dirs: .cache,node_modules,coverage,dist
          version: v0.71.2

      - name: Verify Trivy SARIF
        run: test -s trivy-results.sarif

      - name: Upload Trivy SARIF
        if: >-
          ${{
            github.event_name != 'pull_request' ||
            github.event.pull_request.head.repo.full_name == github.repository
          }}
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: trivy-results.sarif
          category: .github/workflows/main.yml:trivy

      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.71.2

      - name: Trivy dependency gate
        run: >-
          trivy fs --scanners vuln --exit-code 1 --severity HIGH,CRITICAL
          --ignore-unfixed --skip-dirs .cache --skip-dirs node_modules
          --skip-dirs coverage --skip-dirs dist .

  combination:
    name: release combination
    continue-on-error: ${{ github.event_name == 'pull_request' && !startsWith(github.base_ref, 'release/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.20.0
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003
      - name: Pack tested packages
        # packages/ is gitignored; the smoke gate packs from source and pins
        # the bytes against PACKAGE_SHA256 before testing them.
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix src/upstream/coding-agents --ignore-scripts --no-audit --no-fund
          npm ci --prefix src/mcp --ignore-scripts --no-audit --no-fund
          npm install --global npm@11.19.1 --ignore-scripts --no-audit --no-fund
          npm run build
          npm run build:coding-agents
          npm run build --prefix src/mcp
          mkdir -p packages
          npm pack --pack-destination packages --silent
          (cd src/upstream/coding-agents && npm pack --pack-destination "$GITHUB_WORKSPACE/packages" --silent)
          npm pack ./src/mcp --pack-destination packages --silent
          node .github/scripts/verify-package-inventory.cjs
          sha256sum --check PACKAGE_SHA256
      - name: Resolve tested combination
        id: pins
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: await require('./.github/scripts/combination.cjs')({ github, context, core });
      - name: Check out router test harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mickey-kras/hindsight-memory-router
          ref: ${{ steps.pins.outputs.router_sha }}
          path: .router
          persist-credentials: false
      - name: Test packaged clients against router and Hindsight
        env:
          ROUTER_TEST_IMAGE: ${{ steps.pins.outputs.router_image }}
          ROUTER_TEST_VERSION: ${{ steps.pins.outputs.router_version }}
          HINDSIGHT_TEST_IMAGE: ${{ steps.pins.outputs.image }}
        run: bash .github/scripts/combination-smoke.sh
