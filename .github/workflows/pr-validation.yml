name: PR validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      number:
        description: Dependabot PR number
        required: true
      expected_head:
        description: Prepared Dependabot commit
        required: true

permissions:
  contents: read
  pull-requests: read
  security-events: write

concurrency:
  group: pr-validation-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.number }}
  cancel-in-progress: true

jobs:
  quality:
    uses: ./.github/workflows/ci.yml

  aislop:
    uses: ./.github/workflows/aislop.yml

  codeql:
    uses: ./.github/workflows/codeql.yml

  branch-policy:
    uses: ./.github/workflows/branch-policy.yml

  dependabot-policy:
    uses: ./.github/workflows/dependabot-policy-tests.yml
