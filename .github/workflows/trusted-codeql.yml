name: trusted codeql
'on':
  workflow_call:
    inputs:
      revision_ref:
        type: string
        default: ''
      revision_sha:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25
        with:
          egress-policy: audit
      - name: Check out immutable workflow implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: trusted
          persist-credentials: false
      - name: Validate candidate identity
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          REVISION_SHA: ${{ inputs.revision_sha }}
          REVISION_REF: ${{ inputs.revision_ref }}
        with:
          script: |
            const result = await require('./trusted/.github/trusted-ci/identity.cjs').identify({github, context, sha: process.env.REVISION_SHA, ref: process.env.REVISION_REF});
            for (const [key, value] of Object.entries(result)) core.setOutput(key, value);
        id: identity
      - name: Check out validated candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.identity.outputs.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d
        with:
          languages: javascript-typescript
          build-mode: none
          source-root: candidate
          config-file: ./trusted/.github/trusted-ci/codeql.yml
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d
        with:
          category: .github/workflows/main.yml:analyze
          upload: false
          output: ${{ runner.temp }}/codeql-results
      - name: Revalidate candidate before publication
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          REVISION_SHA: ${{ inputs.revision_sha }}
          REVISION_REF: ${{ inputs.revision_ref }}
        with:
          script: |
            const result = await require('./trusted/.github/trusted-ci/identity.cjs').identify({github, context, sha: process.env.REVISION_SHA, ref: process.env.REVISION_REF});
            for (const [key, value] of Object.entries(result)) core.setOutput(key, value);
        id: revalidated
        if: ${{ !cancelled() }}
      - name: Upload CodeQL SARIF
        if: ${{ !cancelled() && steps.revalidated.outputs.upload == 'true' }}
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d
        with:
          sarif_file: ${{ runner.temp }}/codeql-results
          checkout_path: candidate
          category: .github/workflows/main.yml:analyze
          ref: ${{ steps.revalidated.outputs.ref }}
          sha: ${{ steps.revalidated.outputs.sha }}
